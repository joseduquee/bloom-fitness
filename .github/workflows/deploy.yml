# Despliegue a producción en AWS (spec 000, HU-000-3). Arquitectura objetivo de la memoria (4.2.2).
#
# En el TFT no se despliega en AWS para no generar costes: este workflow documenta cómo se haría
# y solo se ejecuta manualmente (Actions → Deploy AWS → Run workflow). Para activarlo de forma
# automática al fusionar en main, añade `push: branches: [main]` en `on`.
#
# Se autentica en AWS con OIDC: el repositorio no guarda claves de acceso (AC-000-08).
# Los identificadores de la infraestructura se configuran como variables del entorno
# "production" de GitHub (Settings → Environments → production → Variables).
name: Deploy AWS

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  api:
    name: API → ECR + ECS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - name: Construir y publicar la imagen (etiquetada con el SHA)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Aplicar migraciones
        run: |
          pnpm install --frozen-lockfile --filter @bloom/api...
          DATABASE_URL=$(aws secretsmanager get-secret-value \
            --secret-id "${{ vars.API_SECRET_ID }}" \
            --query SecretString --output text | jq -r .DATABASE_URL)
          echo "::add-mask::$DATABASE_URL"
          DATABASE_URL="$DATABASE_URL" pnpm --filter @bloom/api db:deploy

      - name: Descargar la definición de tarea actual
        run: |
          aws ecs describe-task-definition --task-definition "${{ vars.ECS_TASK_FAMILY }}" \
            --query taskDefinition > task-definition.json

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          environment-variables: APP_VERSION=${{ github.sha }}

      - name: Desplegar en ECS (despliegue sin interrupción)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true

  web:
    name: Web → S3 + CloudFront
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Compilar la SPA
        run: |
          pnpm install --frozen-lockfile --filter @bloom/web...
          pnpm --filter @bloom/shared build
          pnpm --filter @bloom/web build
        env:
          VITE_API_URL: ${{ vars.API_URL }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publicar en S3 e invalidar CloudFront
        run: |
          # Los recursos con hash se cachean un año; index.html nunca.
          aws s3 sync apps/web/dist "s3://${{ vars.WEB_BUCKET }}" --delete \
            --cache-control "public,max-age=31536000,immutable" --exclude index.html
          aws s3 cp apps/web/dist/index.html "s3://${{ vars.WEB_BUCKET }}/index.html" \
            --cache-control "no-cache"
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/index.html" "/"

  smoke:
    name: Prueba de humo
    runs-on: ubuntu-latest
    needs: [api, web]
    environment: production
    steps:
      - name: El API responde y ejecuta la versión desplegada
        run: |
          for i in $(seq 1 10); do
            body=$(curl -fsS "${{ vars.API_URL }}/health") && break
            sleep 6
          done
          echo "$body"
          echo "$body" | jq -e --arg v "${{ github.sha }}" '.status == "ok" and .version == $v'
      - name: La web responde
        run: curl -fsS -o /dev/null -w "%{http_code}\n" "${{ vars.WEB_URL }}"
      - name: Resumen
        run: |
          echo "### Despliegue completado" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versión: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${{ vars.API_URL }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: ${{ vars.WEB_URL }}" >> "$GITHUB_STEP_SUMMARY"
